services:
  # Сервис базы данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-mydb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Убрали жесткую привязку init.sql, так как миграции будут управляться через код/мигратор
    restart: always

  # Сервис нашего Go-приложения
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_web_app
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgres://${DB_USER:-root}:${DB_PASSWORD:-secret}@db:5432/${DB_NAME:-mydb}?sslmode=disable
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: